<svg viewBox="0 0 400 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Light-vented bulbul">
  <!--
    Original illustration (CC0) for the BioScan Lab exhibit — a stylised
    light-vented bulbul (Pycnonotus sinensis), the everyday garden bird of Hong
    Kong. Each body part is a <g id="…"> group so the 2D anatomy layer can
    highlight / label it (ids match anatomyRegistry).

    The white nape patch is drawn deliberately large: it is the one mark that
    separates this bird from the red-whiskered bulbul, and it is what a child
    will actually look for outside.
  -->
  <defs>
    <linearGradient id="bbBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4f2e8" />
      <stop offset="70%" stop-color="#e6e3d4" />
      <stop offset="100%" stop-color="#d4d2c2" />
    </linearGradient>
    <linearGradient id="bbWing" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#8a9560" />
      <stop offset="55%" stop-color="#6f7a48" />
      <stop offset="100%" stop-color="#54603a" />
    </linearGradient>
  </defs>

  <g id="branch">
    <path d="M 40 316 C 130 306 250 310 360 300" fill="none" stroke="#8a7457"
          stroke-width="13" stroke-linecap="round" />
    <path d="M 250 306 C 276 296 296 288 318 286" fill="none" stroke="#7a6449"
          stroke-width="7" stroke-linecap="round" />
    <g fill="#6d9147">
      <ellipse cx="330" cy="282" rx="17" ry="9" transform="rotate(-18 330 282)" />
      <ellipse cx="304" cy="292" rx="14" ry="8" transform="rotate(8 304 292)" />
    </g>
  </g>

  <g id="tail">
    <path d="M 250 236 C 300 258 336 282 362 306" fill="none" stroke="#5d6a3f"
          stroke-width="20" stroke-linecap="round" />
    <path d="M 258 240 C 302 262 334 284 356 306" fill="none" stroke="#48532f"
          stroke-width="4" stroke-linecap="round" opacity="0.6" />
  </g>

  <g id="body">
    <ellipse cx="196" cy="212" rx="72" ry="58" fill="url(#bbBody)" />
    <path d="M 140 236 C 168 254 208 258 244 246" fill="none" stroke="#c9c6b2"
          stroke-width="5" stroke-linecap="round" opacity="0.7" />
  </g>

  <g id="wing">
    <path d="M 176 178 C 226 176 264 200 268 240 C 240 254 196 250 168 228 Z"
          fill="url(#bbWing)" />
    <g stroke="#46512e" stroke-width="2.4" opacity="0.55" fill="none">
      <path d="M 194 194 C 224 198 248 214 258 236" />
      <path d="M 184 208 C 212 212 236 226 248 244" />
    </g>
  </g>

  <g id="head">
    <circle cx="140" cy="150" r="42" fill="#2a2a26" />
    <!-- 白頭 — the white nape, the bird's whole name in one mark. -->
    <path d="M 118 118 C 140 106 166 112 176 132 C 160 128 138 128 120 140 Z"
          fill="#fdfdf8" />
    <path d="M 150 178 C 132 186 116 184 106 174" fill="none" stroke="#5b5a52"
          stroke-width="6" stroke-linecap="round" opacity="0.55" />
    <ellipse cx="120" cy="176" rx="20" ry="14" fill="#f4f2e8" opacity="0.9" />
  </g>

  <g id="beak">
    <path d="M 100 150 L 62 158 L 100 168 Z" fill="#3c3a33" />
    <path d="M 100 158 L 70 159" fill="none" stroke="#1e1d19" stroke-width="1.6" />
  </g>

  <g id="eye">
    <circle cx="132" cy="144" r="9.5" fill="#141310" />
    <circle cx="132" cy="144" r="9.5" fill="none" stroke="#fdfdf8" stroke-width="2" />
    <circle cx="129" cy="141" r="3" fill="#ffffff" opacity="0.9" />
  </g>

  <g id="leg">
    <g stroke="#8a6a4a" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M 188 268 L 190 302" />
      <path d="M 214 266 L 218 300" />
      <path d="M 190 302 L 176 310 M 190 302 L 202 310" />
      <path d="M 218 300 L 206 309 M 218 300 L 230 308" />
    </g>
  </g>
</svg>
